<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<style>
  @font-face {
    font-family: 'Jost';
    src: url('../assets/fonts/jost-latin-variable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0d0e14;
    font-family: 'Jost', system-ui, sans-serif;
    color: #E8EAF2;
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-a {
    width: 900px; height: 900px; top: -320px; left: -220px;
    background: radial-gradient(circle at center, rgba(255,20,147,0.22) 0%, rgba(190,72,224,0.14) 38%, transparent 68%);
  }
  .blob-b {
    width: 820px; height: 820px; bottom: -360px; right: -200px;
    background: radial-gradient(circle at center, rgba(0,240,255,0.18) 0%, rgba(57,255,20,0.08) 38%, transparent 68%);
  }
  .blob-c {
    width: 600px; height: 600px; top: 40%; right: 12%;
    background: radial-gradient(circle at center, rgba(190,72,224,0.13) 0%, rgba(255,20,147,0.07) 42%, transparent 65%);
  }
  .stage {
    position: relative; width: 1200px; height: 630px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .brand-icon { margin-bottom: 22px; filter: drop-shadow(0 0 18px rgba(190,72,224,0.75)); }
  .wordmark {
    font-size: 172px; font-weight: 900; letter-spacing: -0.04em;
    display: inline-flex; align-items: center; line-height: 1; margin-bottom: 22px;
  }
  .d-shrink {
    color: transparent; -webkit-text-stroke: 4px #00F0FF;
    filter: drop-shadow(0 0 28px rgba(0,240,255,0.6)); letter-spacing: -0.05em;
  }
  .d-ray {
    background: linear-gradient(180deg, #FFFFFF 0%, #FF1493 50%, #BE48E0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 48px rgba(255,20,147,0.8)); padding-left: 0.04em; letter-spacing: 0.01em;
  }
  .hero-rule {
    height: 2px; width: 680px; margin-bottom: 26px;
    background: linear-gradient(90deg, transparent, #FF1493 25%, #BE48E0 50%, #00F0FF 75%, transparent);
    box-shadow: 0 0 16px rgba(190,72,224,0.6);
  }
  .tagline { font-size: 28px; font-weight: 500; color: #A2A9BD; letter-spacing: 0.01em; margin-bottom: 30px; }
  .facts { display: flex; gap: 14px; }
  .fact {
    display: inline-flex; align-items: center; gap: 10px; color: #A2A9BD;
    font-size: 17px; font-weight: 500;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px; padding: 9px 20px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-pink   { background: #FF1493; box-shadow: 0 0 7px #FF1493; }
  .dot-violet { background: #BE48E0; box-shadow: 0 0 7px #BE48E0; }
  .dot-cyan   { background: #00F0FF; box-shadow: 0 0 7px #00F0FF; }
  .url {
    position: absolute; bottom: 26px; right: 40px;
    font-size: 15px; font-weight: 500; color: #626A80; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="stage">
    <svg class="brand-icon" viewBox="0 0 48 48" fill="none" width="52" height="52">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#00F0FF"/>
          <stop offset="50%"  stop-color="#BE48E0"/>
          <stop offset="100%" stop-color="#FF1493"/>
        </linearGradient>
      </defs>
      <path d="M24 4L4 24L24 44L44 24L24 4Z" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 12L12 24L24 36L36 24L24 12Z" fill="url(#g)" opacity="0.85"/>
    </svg>
    <div class="wordmark">
      <span class="d-shrink">SHRINK</span><span class="d-ray">RAY</span>
    </div>
    <div class="hero-rule"></div>
    <p class="tagline">Free In-Browser Video Compressor</p>
    <div class="facts">
      <span class="fact"><span class="dot dot-pink"></span>No uploads</span>
      <span class="fact"><span class="dot dot-violet"></span>100% Private</span>
      <span class="fact"><span class="dot dot-cyan"></span>Hardware Accelerated</span>
    </div>
  </div>
  <div class="url">shrinkray.pixelabs.net</div>
</body>
</html>
